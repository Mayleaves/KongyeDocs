<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="360" height="240">
  <defs>
    <clipPath id="left-eye-hunt">
      <ellipse cx="83.5" cy="83.5" rx="7.6" ry="4.5" transform="rotate(10 83.5 83.5)" />
    </clipPath>
    <clipPath id="right-eye-hunt">
      <ellipse cx="108.5" cy="83.5" rx="7.6" ry="4.5" transform="rotate(-10 108.5 83.5)" />
    </clipPath>
  </defs>

  <g fill="#ffffff" stroke="#262626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

    <!-- 玩具小老鼠：完全留在画布左侧地面，圆耳尖嘴卷尾巴 -->
    <path data-motion="MOUSE_TOY" d="M 57 122 C 62 122, 65 117, 62 115 C 59 114, 60 119, 65 120" fill="none" stroke-width="1.9" />
    <path data-motion="MOUSE_TOY" d="M 36 124.5 C 37 117, 45 113, 53 115 C 57 116.5, 59 120.5, 58 124.5 Z" stroke-width="2.3" />
    <path data-motion="MOUSE_TOY" d="M 43 115 C 40 109, 48 107, 49.5 113.5" stroke-width="2.1" />
    <circle data-motion="MOUSE_TOY" cx="35.5" cy="123.5" r="1.4" fill="#262626" stroke="none" />
    <circle data-motion="MOUSE_TOY" cx="41.5" cy="120" r="1.2" fill="#262626" stroke="none" />
    <line data-motion="MOUSE_TOY" x1="36" y1="122" x2="32.5" y2="120.5" stroke-width="1.3" />
    <line data-motion="MOUSE_TOY" x1="36" y1="124" x2="32.5" y2="124.5" stroke-width="1.3" />
    <path data-motion="MOUSE_TOY" d="M 37 109 Q 39 106.5 42 107.5" fill="none" stroke-width="1.5" />

    <!-- 蓄势翘起的蓬松大尾巴（流畅上扬，完全留在右边界内） -->
    <path d="M 166 109 C 178 102, 185 88, 184 74 L 190 74 L 187 65 L 193 62 C 198 76, 196 96, 187 108 L 191 112 L 181 119 C 175 121, 169 120, 164 117 Z" />

    <!-- 猫咪轮廓（与常规坐姿完全一致的身体比例，重心落在 y=125） -->
    <path data-role="body" d="M 68 45 L 84 60 Q 95 54 108 60 L 124 45 L 123 73 L 130 76 L 126 81 C 149 81, 163 91, 168 105 L 172 106 L 168 114 L 172 120 L 166 125 L 70 125 L 66 119 L 70 113 L 68 105 C 66 99, 68 93, 70 88 L 64 84 L 69 78 Z" />

    <!-- 耳廓内侧线条 -->
    <line x1="74" y1="56" x2="81" y2="66" stroke-width="2" />
    <line x1="118" y1="56" x2="110" y2="66" stroke-width="2" />

    <!-- 专注盯着小老鼠的猫眼（竖瞳微微望向左下方） -->
    <ellipse cx="83.5" cy="83.5" rx="7.6" ry="4.5" transform="rotate(10 83.5 83.5)" stroke-width="2" />
    <g clip-path="url(#left-eye-hunt)">
      <ellipse cx="80.5" cy="84.5" rx="1.9" ry="4.2" fill="#262626" stroke="none" />
      <circle cx="81.6" cy="82.8" r="0.9" fill="#ffffff" stroke="none" />
    </g>
    <ellipse cx="108.5" cy="83.5" rx="7.6" ry="4.5" transform="rotate(-10 108.5 83.5)" stroke-width="2" />
    <g clip-path="url(#right-eye-hunt)">
      <ellipse cx="105.5" cy="84.5" rx="1.9" ry="4.2" fill="#262626" stroke="none" />
      <circle cx="106.6" cy="82.8" r="0.9" fill="#ffffff" stroke="none" />
    </g>
    <!-- 微微压低的小眉梢，专注又俏皮 -->
    <path d="M 78 74.5 L 87 76.8" fill="none" stroke-width="1.9" />
    <path d="M 114 74.5 L 105 76.8" fill="none" stroke-width="1.9" />

    <!-- 嘴巴与胡须 -->
    <path d="M 91.5 93 L 96 90.5 L 100.5 93" fill="none" stroke-width="2" />
    <line x1="60" y1="90" x2="70" y2="88" stroke-width="2.1" />
    <line x1="61" y1="96" x2="71" y2="93" stroke-width="2.1" />
    <line x1="120" y1="88" x2="131" y2="90" stroke-width="2.1" />
    <line x1="119" y1="93" x2="130" y2="96" stroke-width="2.1" />

    <!-- 稳住身体的右前爪与后腿折线 -->
    <path d="M 103 125 A 6.2 6.2 0 0 1 115 125" fill="none" stroke-width="2.5" />
    <path d="M 139 125 C 139 115, 144 111, 151 111" fill="none" stroke-width="2.5" />

    <!-- 向前伸出轻拍小老鼠的左前爪 -->
    <path data-motion="MOUSE_PAW" d="M 82 115 C 74 114.5, 67 116.5, 61.5 119.5 C 58 121.5, 59 125, 64 125 L 82 125" stroke-width="2.6" />
    <path data-motion="MOUSE_PAW" d="M 62 121.2 L 65.5 122 M 63 123.3 L 66.5 123.7" fill="none" stroke-width="1.5" />
  </g>
</svg>
