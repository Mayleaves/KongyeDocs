<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="360" height="240">
  <g fill="#ffffff" stroke="#262626" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 垂在边缘放松的大毛尾巴（延续原图造型） -->
    <path data-motion="SLEEP_TAIL" d="M 164 102 C 180 105, 190 116, 192 124 L 198 124 L 194 132 L 200 138 L 192 146 C 190 151, 182 153, 173 154 C 166 146, 164 130, 164 112 Z" />

    <!-- 猫咪放松趴睡的身体与头部轮廓 -->
    <path d="M 65 72 
             L 61 38 L 83 56 
             Q 97 50 111 56 
             L 133 38 L 129 68 
             L 139 72 L 133 78 
             C 155 80, 170 92, 174 105 
             L 179 108 L 173 114 L 177 120 
             L 70 120 
             L 64 113 L 68 105 L 64 94 L 68 85 L 58 80 L 65 74 Z" />

    <!-- 耳廓内侧线条 -->
    <line x1="68" y1="49" x2="78" y2="61" stroke-width="2.4" />
    <line x1="126" y1="49" x2="116" y2="61" stroke-width="2.4" />

    <!-- 原图同款傲娇眯眯眼与倒V嘴巴 -->
    <line x1="76" y1="76" x2="91" y2="79" stroke-width="3.2" />
    <line x1="118" y1="76" x2="103" y2="79" stroke-width="3.2" />
    <path d="M 92 86 L 97 82 L 102 86" fill="none" stroke-width="2.6" />

    <!-- 两侧垂下放松的胡须 -->
    <line x1="55" y1="83" x2="68" y2="80" stroke-width="2.2" />
    <line x1="56" y1="90" x2="69" y2="86" stroke-width="2.2" />
    <line x1="122" y1="80" x2="136" y2="83" stroke-width="2.2" />
    <line x1="121" y1="86" x2="135" y2="90" stroke-width="2.2" />

    <!-- 原图同款乖巧并拢的双前爪与后腿折线 -->
    <path data-motion="SLEEP_LEFT_PAW" d="M 76 120 A 8 7 0 0 1 92 120 Z" />
    <path data-motion="SLEEP_RIGHT_PAW" d="M 98 120 A 8 7 0 0 1 114 120 Z" />
    <path d="M 140 120 C 140 106, 150 100, 160 100" fill="none" />

    <!-- 熟睡鼻涕泡（带高光弧线） -->
    <circle data-motion="SLEEP_BUBBLE" cx="83" cy="91" r="7.5" stroke-width="2.4" />
    <path data-motion="SLEEP_BUBBLE" d="M 79 88 A 4 4 0 0 1 83 86" fill="none" stroke-width="1.8" />

    <!-- 打呼噜 Zzz 符号（由小到大飘向右上角） -->
    <path d="M 138 54 L 145 54 L 138 62 L 145 62" fill="none" stroke-width="2.2" />
    <path d="M 150 38 L 159 38 L 150 48 L 159 48" fill="none" stroke-width="2.6" />
    <path d="M 165 20 L 176 20 L 165 32 L 176 32" fill="none" stroke-width="3" />

    <!-- 呼噜呼噜的背部震动波纹 -->
    <path d="M 152 72 Q 160 74 165 81" fill="none" stroke-width="2" />
    <path d="M 157 67 Q 166 70 171 77" fill="none" stroke-width="2" />
    <path d="M 50 64 Q 46 70 48 77" fill="none" stroke-width="2" />
  </g>
</svg>