<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="360" height="240">
  <g fill="#ffffff" stroke="#262626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

    <!-- 垂在边缘放松的大毛尾巴（与常规坐姿同款比例） -->
    <path data-motion="SLEEP_TAIL" d="M 170 105 C 180 109, 186 116, 188 125 L 193 126 L 189 134 L 194 141 L 189 149 C 188 158, 183 163, 175 163 L 170 165 C 165 158, 164 146, 164 129 L 164 120 Z" />

    <!-- 猫咪轮廓（与常规小猫完全统一的比例、耳朵与颊毛） -->
    <path data-role="body" d="M 68 40 L 84 55 Q 95 49 108 55 L 124 40 L 123 68 L 130 71 L 126 76 C 149 76, 163 86, 168 100 L 172 101 L 168 109 L 172 115 L 166 120 L 70 120 L 66 114 L 70 108 L 68 100 C 66 94, 68 88, 70 83 L 64 79 L 69 73 Z" />

    <!-- 耳廓内侧线条 -->
    <line x1="74" y1="51" x2="81" y2="61" stroke-width="2" />
    <line x1="118" y1="51" x2="110" y2="61" stroke-width="2" />

    <!-- 安稳熟睡的弯弯闭眼 -->
    <path d="M 78 75 Q 84 80 90 75" fill="none" stroke-width="2.7" />
    <path d="M 102 75 Q 108 80 114 75" fill="none" stroke-width="2.7" />

    <!-- 放松的小嘴 -->
    <path d="M 92 85.5 Q 94 88 96 85.5 Q 98 88 100 85.5" fill="none" stroke-width="2" />

    <!-- 两侧垂下放松的胡须 -->
    <line x1="60" y1="85" x2="70" y2="83" stroke-width="2.1" />
    <line x1="61" y1="91" x2="71" y2="88" stroke-width="2.1" />
    <line x1="120" y1="83" x2="131" y2="85" stroke-width="2.1" />
    <line x1="119" y1="88" x2="130" y2="91" stroke-width="2.1" />

    <!-- 乖巧并拢的双前爪与后腿折线 -->
    <path data-motion="SLEEP_LEFT_PAW" d="M 81 120 A 6.2 6.2 0 0 1 94 120" fill="none" stroke-width="2.5" />
    <path data-motion="SLEEP_RIGHT_PAW" d="M 103 120 A 6.2 6.2 0 0 1 115 120" fill="none" stroke-width="2.5" />
    <path d="M 139 120 C 139 110, 144 106, 151 106" fill="none" stroke-width="2.5" />

    <!-- 鼻子边轻轻鼓起的小鼻涕泡（带柔和反光弧） -->
    <circle data-motion="SLEEP_BUBBLE" data-effect="BUBBLE" cx="93.5" cy="90" r="4.8" stroke-width="2" />
    <path data-motion="SLEEP_BUBBLE" data-effect="BUBBLE" d="M 91.2 88.2 A 2.4 2.4 0 0 1 93.8 87" fill="none" stroke-width="1.5" />

    <!-- 打呼噜 z z Z（柔和倾斜，依次飘向右上角） -->
    <path data-effect="Z1" d="M 137 54 L 143 52.5 L 138 59.5 L 144.5 58" fill="none" stroke-width="2" />
    <path data-effect="Z2" d="M 150 40 L 158 38 L 151.5 47.5 L 159.5 45.5" fill="none" stroke-width="2.3" />
    <path data-effect="Z3" d="M 164 24 L 174 21.5 L 166 33 L 176 30.5" fill="none" stroke-width="2.6" />
  </g>
</svg>
